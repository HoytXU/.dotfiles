- defaults:
    link:
      create: true
      relink: true
      force: true

- link:
    ~/.bashrc: shell/.bashrc
    ~/.inputrc: shell/.inputrc
    ~/.vimrc: shell/.vimrc
    ~/.zshrc: shell/.zshrc
    ~/.vim: shell/.vim
    ~/.tmux.conf: shell/.tmux.conf
    ~/.oh-my-zsh: shell/.oh-my-zsh
    ~/.config/nvim: shell/.config/nvim
    ~/.p10k.zsh: shell/.p10k.zsh
    ~/.wezterm.lua: shell/.wezterm.lua
    ~/wezterm_background.jpg: shell/wezterm_background.jpg

- shell:
  - git submodule sync --recursive
